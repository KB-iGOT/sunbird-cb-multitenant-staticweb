<section class="benefits-section">
  <div class="benefits-wrapper">
    <!-- Scroller -->
    <div class="benefits-scroller">

      <!-- Left Arrow -->
      <button
        class="scroll-btn scroll-btn--left"
        [class.hidden]="!canScrollLeft"
        (click)="scroll('left')"
        aria-label="Scroll left"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <!-- Track -->
      <div class="benefits-track" #scrollTrack>
        <div
          *ngFor="let card of benefitcards"
          class="benefit-card"
        >
          <!-- Title -->
          <h3 class="benefit-card__title">{{ card.title }}</h3>

          <!-- Icon -->
          <div class="benefit-card__icon-wrap">
            <ng-container [ngSwitch]="card.icon">

              <!-- Economy: columns/pillar icon -->
              <svg *ngSwitchCase="'economy'" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="6" y="20" width="6" height="18" rx="1" stroke="#1a7bbf" stroke-width="2.2" fill="none"/>
                <rect x="15" y="14" width="6" height="24" rx="1" stroke="#1a7bbf" stroke-width="2.2" fill="none"/>
                <rect x="24" y="18" width="6" height="20" rx="1" stroke="#1a7bbf" stroke-width="2.2" fill="none"/>
                <rect x="33" y="10" width="6" height="28" rx="1" stroke="#1a7bbf" stroke-width="2.2" fill="none"/>
                <line x1="4" y1="39" x2="44" y2="39" stroke="#1a7bbf" stroke-width="2.2" stroke-linecap="round"/>
                <line x1="4" y1="10" x2="44" y2="10" stroke="#1a7bbf" stroke-width="2.2" stroke-linecap="round"/>
              </svg>

              <!-- Environment: leaf -->
              <svg *ngSwitchCase="'environment'" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 36C12 36 14 18 30 12C38 9 40 10 40 10C40 10 40 16 34 24C28 32 18 34 12 36Z" stroke="#1a7bbf" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
                <line x1="12" y1="36" x2="24" y2="24" stroke="#1a7bbf" stroke-width="2.2" stroke-linecap="round"/>
              </svg>

              <!-- Technology: laptop -->
              <svg *ngSwitchCase="'technology'" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="10" width="32" height="22" rx="2.5" stroke="#1a7bbf" stroke-width="2.2" fill="none"/>
                <line x1="4" y1="34" x2="44" y2="34" stroke="#1a7bbf" stroke-width="2.2" stroke-linecap="round"/>
                <line x1="18" y1="34" x2="30" y2="38" stroke="#1a7bbf" stroke-width="2.2" stroke-linecap="round"/>
              </svg>

              <!-- Governance: shield + magnifier -->
              <svg *ngSwitchCase="'governance'" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 6L38 12V24C38 32 24 42 24 42C24 42 10 32 10 24V12L24 6Z" stroke="#1a7bbf" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
                <circle cx="24" cy="22" r="5" stroke="#1a7bbf" stroke-width="2.2" fill="none"/>
                <line x1="28" y1="26" x2="32" y2="30" stroke="#1a7bbf" stroke-width="2.2" stroke-linecap="round"/>
              </svg>

              <!-- Health: cross/plus -->
              <svg *ngSwitchCase="'health'" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="20" y="8" width="8" height="32" rx="2" stroke="#1a7bbf" stroke-width="2.2" fill="none"/>
                <rect x="8" y="20" width="32" height="8" rx="2" stroke="#1a7bbf" stroke-width="2.2" fill="none"/>
              </svg>

              <!-- Infrastructure: building/city -->
              <svg *ngSwitchCase="'infrastructure'" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="6" y="20" width="16" height="22" rx="1.5" stroke="#1a7bbf" stroke-width="2.2" fill="none"/>
                <rect x="22" y="10" width="20" height="32" rx="1.5" stroke="#1a7bbf" stroke-width="2.2" fill="none"/>
                <line x1="4" y1="42" x2="44" y2="42" stroke="#1a7bbf" stroke-width="2.2" stroke-linecap="round"/>
                <rect x="28" y="28" width="8" height="14" rx="1" stroke="#1a7bbf" stroke-width="2" fill="none"/>
                <rect x="10" y="26" width="4" height="4" rx="0.5" stroke="#1a7bbf" stroke-width="1.8" fill="none"/>
              </svg>

              <!-- Leadership: star -->
              <svg *ngSwitchCase="'leadership'" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="24,6 29,18 43,18 32,27 36,40 24,32 12,40 16,27 5,18 19,18" stroke="#1a7bbf" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
              </svg>

            </ng-container>
          </div>

          <!-- Description -->
          <p class="benefit-card__desc">{{ card.description }}</p>
        </div>
      </div>

      <!-- Right Arrow -->
      <button
        class="scroll-btn scroll-btn--right"
        [class.hidden]="!canScrollRight"
        (click)="scroll('right')"
        aria-label="Scroll right"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

    </div>
  </div>
</section>
